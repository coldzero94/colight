openapi: 3.0.0
info:
  title: Colight API
  version: 0.0.0
tags:
  - name: System
paths:
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
      tags:
        - System
components: {}
servers:
  - url: https://colight-api.koyeb.app
    description: Production
    variables: {}
  - url: http://localhost:9000
    description: Local development
    variables: {}
