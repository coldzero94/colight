components:
  schemas:
    Admin.AdminUserListItem:
      type: object
      required:
        - id
        - role
        - auth_provider
        - experience_count
        - created_at
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        auth_provider:
          type: string
          enum:
            - email
            - naver
        experience_count:
          type: integer
          format: int32
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Admin.PromptTemplateDetail:
      type: object
      required:
        - id
        - category
        - sub_category
        - name
        - system_prompt
        - user_prompt_template
        - model_name
        - temperature
        - max_tokens
        - version
        - is_active
        - usage_count
      properties:
        id:
          type: string
        category:
          type: string
        sub_category:
          type: string
        name:
          type: string
        system_prompt:
          type: string
        user_prompt_template:
          type: string
        model_name:
          type: string
        temperature:
          type: number
          format: float
        max_tokens:
          type: integer
          format: int32
        version:
          type: integer
          format: int32
        is_active:
          type: boolean
        usage_count:
          type: integer
          format: int32
    Admin.SystemStats:
      type: object
      required:
        - total_users
        - active_users_today
        - total_experiences
        - total_coaching_sessions
        - total_analyses
        - naver_auth_users
        - email_auth_users
      properties:
        total_users:
          type: integer
          format: int32
        active_users_today:
          type: integer
          format: int32
        total_experiences:
          type: integer
          format: int32
        total_coaching_sessions:
          type: integer
          format: int32
        total_analyses:
          type: integer
          format: int32
        naver_auth_users:
          type: integer
          format: int32
        email_auth_users:
          type: integer
          format: int32
    Admin.UpdatePromptRequest:
      type: object
      properties:
        system_prompt:
          type: string
        user_prompt_template:
          type: string
        temperature:
          type: number
          format: float
        max_tokens:
          type: integer
          format: int32
        is_active:
          type: boolean
    Admin.UpdateRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - user
            - admin
    Auth.AuthResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/Auth.UserInfo'
        tokens:
          $ref: '#/components/schemas/Auth.AuthTokens'
    Auth.AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int32
    Auth.LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    Auth.SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        nickname:
          type: string
    Auth.UserInfo:
      type: object
      required:
        - id
        - role
        - auth_provider
        - onboarding_completed
        - created_at
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        auth_provider:
          type: string
          enum:
            - email
            - naver
        onboarding_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
    Common.ErrorDetail:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://colight-api.koyeb.app
    description: Production
    variables: {}
  - url: http://localhost:9000
    description: Local development
    variables: {}
