components:
  schemas:
    Admin.AIErrorItem:
      type: object
      required:
        - id
        - error_type
        - error_message
        - feature
        - user_id
        - input_tokens
        - output_tokens
        - created_at
      properties:
        id:
          type: string
        error_type:
          type: string
          enum:
            - rate_limit
            - timeout
            - provider_error
            - invalid_request
            - context_exceeded
        error_message:
          type: string
        model:
          type: string
        provider:
          type: string
        feature:
          type: string
        user_id:
          type: string
        input_tokens:
          type: integer
          format: int32
        output_tokens:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
    Admin.AIMetricsToday:
      type: object
      required:
        - calls
        - calls_delta_pct
        - error_rate
        - error_rate_delta
        - cost_krw
      properties:
        calls:
          type: integer
          format: int32
        calls_delta_pct:
          type: number
          format: float
        error_rate:
          type: number
          format: float
        error_rate_delta:
          type: number
          format: float
        cost_krw:
          type: number
          format: float
    Admin.AdminUserListItem:
      type: object
      required:
        - id
        - role
        - auth_provider
        - experience_count
        - created_at
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        auth_provider:
          type: string
          enum:
            - email
            - naver
        experience_count:
          type: integer
          format: int32
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Admin.DailyMetric:
      type: object
      required:
        - date
        - calls
        - error_count
        - cost_krw
      properties:
        date:
          type: string
        calls:
          type: integer
          format: int32
        error_count:
          type: integer
          format: int32
        cost_krw:
          type: number
          format: float
    Admin.DashboardData:
      type: object
      required:
        - user_stats
