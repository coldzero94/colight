language: go
type: application

tasks:
  dev:
    command: air
    options:
      persistent: true
    local: true
  build:
    command: go build -o bin/api ./cmd/api
  test:
    command: go test ./...
  lint:
    command: golangci-lint run ./...
  generate-ent:
    command: go generate ./ent
  generate-api:
    command: oapi-codegen -config oapi-codegen.yaml ../../packages/protocol/tsp-output/openapi.yaml
    deps:
      - "protocol:generate"
  migrate-diff:
    command: atlas migrate diff $0 --env local
    args: positional
  migrate-apply:
    command: atlas migrate apply --env prod
  seed:
    command: go run ./scripts/seed.go all
